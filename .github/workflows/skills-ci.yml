name: skills-ci

on:
  push:
    paths:
      - "mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown/**"
      - "mes-skills/dev/specifications-produit/.claude/skills/prd-from-sources/**"
      - "archives/to-markdown.zip"
      - "archives/prd-from-sources.zip"
      - ".github/workflows/skills-ci.yml"
  pull_request:
    paths:
      - "mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown/**"
      - "mes-skills/dev/specifications-produit/.claude/skills/prd-from-sources/**"
      - "archives/to-markdown.zip"
      - "archives/prd-from-sources.zip"
      - ".github/workflows/skills-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: |
          ruff check \
            mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown \
            mes-skills/dev/specifications-produit/.claude/skills/prd-from-sources
      - name: Les archives suivent les sources (contenu du dossier, sans dossier parent)
        run: |
          python3 - <<'PY'
          import sys, zipfile
          from pathlib import Path
          SKILLS = {
              "to-markdown": "mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown",
              "prd-from-sources": "mes-skills/dev/specifications-produit/.claude/skills/prd-from-sources",
          }
          bad = []
          for name, folder in SKILLS.items():
              root = Path(folder)
              zf = zipfile.ZipFile(f"archives/{name}.zip")
              in_zip = {n for n in zf.namelist() if not n.endswith("/")}
              files = {}
              for p in root.rglob("*"):
                  rel = p.relative_to(root).as_posix()
                  if p.is_file() and "__pycache__" not in rel and ".ruff_cache" not in rel and not rel.endswith((".pyc", ".mdconv-cache.json")):
                      files[rel] = p
              for rel, p in sorted(files.items()):
                  if rel not in in_zip:
                      bad.append(f"{rel} absent de archives/{name}.zip")
                  elif zf.read(rel) != p.read_bytes():
                      bad.append(f"{rel} différent de archives/{name}.zip")
              for rel in sorted(in_zip - files.keys()):
                  bad.append(f"{rel} est dans archives/{name}.zip mais pas dans le dossier du skill")
          print("\n".join(bad) or "archives à jour")
          sys.exit(1 if bad else 0)
          PY

  to-markdown:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (bibliothèque standard seule ; les tests qui exigent un outil externe sont ignorés)
        working-directory: mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown
        run: python -m unittest discover -s tests
      - name: Fumée de la ligne de commande
        working-directory: mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown
        run: |
          python scripts/convert.py --doctor > /dev/null
          python scripts/convert.py --plan tests > /dev/null

  extreme-reduit:
    # Batterie « cas extrêmes » en version réduite : séries B (hostilité), C (fichiers abîmés), D (Unicode), F (pièges Markdown).
    # La version complète (86 cas, ≈ 55 Mo) se lance à la main : voir benchmark/extreme/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Génération du corpus (B, C, D, F)
        working-directory: mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown/benchmark/extreme
        run: python gen_extreme.py "$RUNNER_TEMP/extreme" --only BCDF
      - name: Lancement (processus séparés, plafonds de temps et de mémoire)
        working-directory: mes-skills/autres-transverse/conversion-de-fichiers/.claude/skills/to-markdown/benchmark/extreme
        run: |
          for serie in B C D F; do
            python run_extreme.py "$RUNNER_TEMP/extreme" "$RUNNER_TEMP/extreme-runs-$serie" --only "$serie"
          done

  prd-from-sources:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - working-directory: mes-skills/dev/specifications-produit/.claude/skills/prd-from-sources
        run: |
          python -m unittest discover -s tests
          python scripts/check_prd.py examples/cantine/prd.md --sources examples/cantine/sources --strict
