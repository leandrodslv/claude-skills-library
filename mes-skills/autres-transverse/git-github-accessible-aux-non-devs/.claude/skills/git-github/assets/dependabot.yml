version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"       # reste conventionnel — pas de release pour un simple bump
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      # Un seul commit/PR pour les bumps mineurs/patch, au lieu d'une PR par package.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
