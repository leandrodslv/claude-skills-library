name: Release

# release-please maintient une PR de release ouverte en permanence, alimentée par les
# commits conventionnels mergés sur main. Merger cette PR crée le tag + la GitHub Release,
# et — dans le même workflow — déclenche le déploiement.
#
# Le job deploy est volontairement dans CE fichier : le GITHUB_TOKEN par défaut ne
# déclenche pas d'autres workflows, donc un workflow séparé en "on: release" ne partirait
# jamais. Supprimer le job deploy si le projet n'en a pas besoin.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

